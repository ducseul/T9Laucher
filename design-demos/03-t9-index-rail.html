<!doctype html>
<!-- Assumption: long app lists benefit from a persistent alphabetical rail. -->
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drawer 03 · T9 Index Rail</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#202124;color:#f4f1eb;font-family:"Segoe UI",sans-serif}body{display:grid;place-items:center}.phone{width:640px;height:960px;background:#151416;overflow:hidden;box-shadow:0 18px 70px #0009}.status{height:56px;padding:0 42px;display:flex;align-items:center;justify-content:space-between;background:#0c0b0d;font-size:24px;font-weight:600}.drawer{height:904px;padding:24px 16px 18px}.top{height:72px;display:grid;grid-template-columns:1fr 174px;gap:16px;align-items:center;margin:0 8px 18px}.top h1{margin:0;font:700 27px/1 "Courier New",monospace;color:#ffb454}.search{height:48px;border:1px solid #4b4644;border-radius:24px;padding:0 16px;background:#211f21}.search input{width:100%;height:100%;border:0;outline:0;background:transparent;color:#fff;text-align:center;font-size:20px}.body{display:grid;grid-template-columns:50px 1fr;gap:12px;height:772px}.rail{padding-top:5px;border-right:1px solid #343034;color:#777176;font:700 14px/1.45 "Courier New",monospace;text-align:center;white-space:pre-line}.list{overflow:auto;scrollbar-width:none;padding-right:2px}.list::-webkit-scrollbar{display:none}.row{height:58px;margin-bottom:8px;border:1px solid transparent;border-radius:7px;padding:0 16px;display:flex;align-items:center;gap:16px;font-size:27px;cursor:pointer;user-select:none}.row .initial{width:28px;color:#777176;font:700 17px/1 "Courier New",monospace}.row.active{border-color:#ffb454;background:#231f1c;color:#ffc170}.row.active .initial{color:#ffb454}.row.active:after{content:"↵";margin-left:auto;color:#ffb454;font:700 20px/1 "Courier New",monospace}.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 20px;border:1px solid #ffb454;background:#181517;color:#ffbd69;font-weight:700;opacity:0;transition:.18s}.toast.show{opacity:1}
</style></head><body><main class="phone"><div class="status"><span>10:58</span><span>⌁ Wi‑Fi&nbsp; 4G&nbsp; 99%</span></div><section class="drawer"><header class="top"><h1>APP DRAWER</h1><label class="search"><input id="q" placeholder="Tìm app…" autofocus></label></header><div class="body"><aside class="rail">A
C
D
G
L
M
N
O
T
Y</aside><div id="list" class="list"></div></div></section><div id="toast" class="toast"></div></main>
<script>
const apps=["Cửa hàng Play","Máy tính để bàn","Máy tính","Gmail","YouTube","Máy ảnh","Olauncher","Drive","Tài liệu","Maps","Tin nhắn","Telegram","Lịch","Chrome","Danh bạ","Điện thoại","Đồng hồ","Cài đặt","Thư viện","Nhãn dán"];
let shown=[...apps],selected=0,hold;const list=document.querySelector('#list'),q=document.querySelector('#q'),toast=document.querySelector('#toast');
function render(){list.innerHTML=shown.map((a,i)=>`<div class="row ${i===selected?'active':''}" data-i="${i}"><span class="initial">${a[0].toUpperCase()}</span><span>${a}</span></div>`).join('');keepVisible()}
function keepVisible(){const r=list.children[selected];if(!r)return;const t=r.offsetTop,b=t+r.offsetHeight;if(t<list.scrollTop)list.scrollTop=t-8;else if(b>list.scrollTop+list.clientHeight)list.scrollTop=b-list.clientHeight+8}
function openApp(){if(!shown[selected])return;toast.textContent=`Mở ${shown[selected]}`;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),900)}
q.oninput=()=>{shown=apps.filter(a=>a.toLocaleLowerCase('vi').includes(q.value.toLocaleLowerCase('vi')));selected=0;render()};list.onpointerdown=e=>{const r=e.target.closest('.row');if(!r)return;selected=+r.dataset.i;render();hold=setTimeout(openApp,700)};list.onpointerup=e=>{clearTimeout(hold);const r=e.target.closest('.row');if(r){selected=+r.dataset.i;render();openApp()}};list.onpointermove=()=>clearTimeout(hold);
document.onkeydown=e=>{if(e.key==='ArrowDown'){selected=Math.min(shown.length-1,selected+1);render();e.preventDefault()}if(e.key==='ArrowUp'){selected=Math.max(0,selected-1);render();e.preventDefault()}if(e.key==='Enter')openApp()};render();
</script></body></html>
