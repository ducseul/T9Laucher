<!doctype html>
<!-- Assumption: favor maximum breathing room and a non-card list. -->
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drawer 02 · Quiet Lanes</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#d5d0c8;color:#f2efe9;font-family:"Segoe UI",sans-serif}body{display:grid;place-items:center}.phone{width:640px;height:960px;background:#0d1618;overflow:hidden;box-shadow:0 18px 70px #0008}.status{height:56px;padding:0 42px;display:flex;align-items:center;justify-content:space-between;background:#0a0d0e;font-size:24px;font-weight:600}.drawer{height:904px;padding:30px 30px 0}.head{display:flex;align-items:end;justify-content:space-between;margin-bottom:26px}.head h1{margin:0;font:700 39px/.95 "Courier New",monospace;letter-spacing:-.05em;color:#ffbc68}.head span{font:700 14px/1 "Courier New",monospace;color:#818b8c;letter-spacing:.12em}.search{height:52px;border-bottom:2px solid #3a4546;display:flex;align-items:center;margin-bottom:16px}.search input{width:100%;height:100%;border:0;outline:0;background:transparent;color:#fff;font:500 27px/1 "Segoe UI",sans-serif}.search input::placeholder{color:#7f898a}.list{height:728px;overflow:auto;scrollbar-width:none}.list::-webkit-scrollbar{display:none}.row{height:72px;border-bottom:1px solid #263033;padding:0 8px 0 22px;display:flex;align-items:center;position:relative;font-size:29px;cursor:pointer;user-select:none}.row.active{color:#ffc375}.row.active:before{content:"";position:absolute;left:0;top:22px;width:7px;height:28px;background:#ffb454}.row.active:after{content:"ĐANG CHỌN";margin-left:auto;color:#ffb454;font:700 12px/1 "Courier New",monospace;letter-spacing:.1em}.toast{position:absolute;left:30px;right:30px;bottom:24px;padding:13px;text-align:center;background:#ffbc68;color:#101617;font-weight:800;opacity:0;transition:.18s}.toast.show{opacity:1}
</style></head><body><main class="phone"><div class="status"><span>10:58</span><span>⌁ Wi‑Fi&nbsp; 4G&nbsp; 99%</span></div><section class="drawer"><header class="head"><h1>ỨNG DỤNG</h1><span>↑↓ DI CHUYỂN</span></header><label class="search"><input id="q" placeholder="Gõ để lọc danh sách…" autofocus></label><div id="list" class="list"></div></section><div id="toast" class="toast"></div></main>
<script>
const apps=["Cửa hàng Play","Máy tính để bàn","Máy tính","Gmail","YouTube","Máy ảnh","Olauncher","Drive","Tài liệu","Maps","Tin nhắn","Telegram","Lịch","Chrome","Danh bạ","Điện thoại","Đồng hồ","Cài đặt","Thư viện","Nhãn dán"];
let shown=[...apps],selected=0,hold;const list=document.querySelector('#list'),q=document.querySelector('#q'),toast=document.querySelector('#toast');
function render(){list.innerHTML=shown.map((a,i)=>`<div class="row ${i===selected?'active':''}" data-i="${i}">${a}</div>`).join('');keepVisible()}
function keepVisible(){const r=list.children[selected];if(!r)return;const t=r.offsetTop,b=t+r.offsetHeight;if(t<list.scrollTop)list.scrollTop=t;else if(b>list.scrollTop+list.clientHeight)list.scrollTop=b-list.clientHeight}
function openApp(){if(!shown[selected])return;toast.textContent=`Mở ${shown[selected]}`;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),900)}
q.oninput=()=>{shown=apps.filter(a=>a.toLocaleLowerCase('vi').includes(q.value.toLocaleLowerCase('vi')));selected=0;render()};list.onpointerdown=e=>{const r=e.target.closest('.row');if(!r)return;selected=+r.dataset.i;render();hold=setTimeout(openApp,700)};list.onpointerup=e=>{clearTimeout(hold);const r=e.target.closest('.row');if(r){selected=+r.dataset.i;render();openApp()}};list.onpointermove=()=>clearTimeout(hold);
document.onkeydown=e=>{if(e.key==='ArrowDown'){selected=Math.min(shown.length-1,selected+1);render();e.preventDefault()}if(e.key==='ArrowUp'){selected=Math.max(0,selected-1);render();e.preventDefault()}if(e.key==='Enter')openApp()};render();
</script></body></html>
