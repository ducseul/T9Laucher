<!doctype html>
<!-- Assumption: 640x960 Android screen; spacing is the main design variable. -->
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drawer 01 · Balanced Rhythm</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#28282b;color:#f5f2ec;font-family:"Segoe UI",sans-serif}body{display:grid;place-items:center}.phone{width:640px;height:960px;background:#111214;overflow:hidden;box-shadow:0 18px 70px #0009}.status{height:56px;padding:0 42px;display:flex;align-items:center;justify-content:space-between;background:#0b0b0d;font:600 24px/1 "Segoe UI",sans-serif}.drawer{height:904px;padding:28px 16px 18px}.eyebrow{margin:0 14px 12px;color:#8d8d92;font:700 15px/1 "Courier New",monospace;letter-spacing:.16em}.search{height:58px;border:1px solid #3b3b40;background:#242428;border-radius:10px;padding:0 18px;display:flex;align-items:center;gap:14px;margin-bottom:22px}.search b{color:#ffb454;font:700 22px/1 "Courier New",monospace}.search input{width:100%;border:0;outline:0;background:transparent;color:#f5f2ec;font:500 28px/1 "Segoe UI",sans-serif}.search input::placeholder{color:#aaa9ad}.list{height:738px;overflow:auto;scrollbar-width:none}.list::-webkit-scrollbar{display:none}.row{height:64px;margin:0 0 4px;border-radius:9px;padding:0 18px 0 20px;display:flex;align-items:center;position:relative;font-size:28px;cursor:pointer;user-select:none}.row.active{background:#493723;color:#ffbd69}.row.active:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:4px;background:#ffb454}.toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);padding:12px 18px;border-radius:8px;background:#f4efe8;color:#171719;font-weight:700;opacity:0;transition:.18s}.toast.show{opacity:1}
</style></head><body><main class="phone"><div class="status"><span>10:58</span><span>⌁ Wi‑Fi&nbsp; 4G&nbsp; 99%</span></div><section class="drawer"><p class="eyebrow">TẤT CẢ ỨNG DỤNG</p><label class="search"><b>T9</b><input id="q" placeholder="Tìm app…" autofocus></label><div id="list" class="list"></div></section><div id="toast" class="toast"></div></main>
<script>
const apps=["Cửa hàng Play","Máy tính để bàn","Máy tính","Gmail","YouTube","Máy ảnh","Olauncher","Drive","Tài liệu","Maps","Tin nhắn","Telegram","Lịch","Chrome","Danh bạ","Điện thoại","Đồng hồ","Cài đặt","Thư viện","Nhãn dán"];
let shown=[...apps],selected=0,hold;
const list=document.querySelector('#list'),q=document.querySelector('#q'),toast=document.querySelector('#toast');
function render(){list.innerHTML=shown.map((a,i)=>`<div class="row ${i===selected?'active':''}" data-i="${i}"><span>${a}</span></div>`).join(''); keepVisible();}
function keepVisible(){const row=list.children[selected];if(!row)return;const top=row.offsetTop,bottom=top+row.offsetHeight;if(top<list.scrollTop)list.scrollTop=top-8;else if(bottom>list.scrollTop+list.clientHeight)list.scrollTop=bottom-list.clientHeight+8;}
function openApp(){if(!shown[selected])return;toast.textContent=`Mở ${shown[selected]}`;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),900)}
q.addEventListener('input',()=>{shown=apps.filter(a=>a.toLocaleLowerCase('vi').includes(q.value.toLocaleLowerCase('vi')));selected=0;render()});
list.addEventListener('pointerdown',e=>{const row=e.target.closest('.row');if(!row)return;selected=+row.dataset.i;render();hold=setTimeout(openApp,700)});list.addEventListener('pointerup',e=>{clearTimeout(hold);const row=e.target.closest('.row');if(row){selected=+row.dataset.i;render();openApp()}});list.addEventListener('pointermove',()=>clearTimeout(hold));
document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){selected=Math.min(shown.length-1,selected+1);render();e.preventDefault()}if(e.key==='ArrowUp'){selected=Math.max(0,selected-1);render();e.preventDefault()}if(e.key==='Enter')openApp()});render();
</script></body></html>
